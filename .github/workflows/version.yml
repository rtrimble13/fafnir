name: version

# Every version that reaches main is a release (ADR 0022): the release workflow
# publishes v<__version__> when it has no GitHub release yet. So the pull request is
# where the number is chosen, and this is the gate (scripts/check_version.py):
#
#   1. __version__ is X.Y.Z and never goes down.
#   2. A change to what the host runs (src/, sql/, scripts/, etc/, pyproject.toml)
#      raises it above the base branch's: merging publishes it.
#   3. An added migration makes it a minor release at least, unless the migration
#      marks itself `-- release: patch` (one that only fixes).
#
# The script is stdlib-only and reads the base commit from the event itself, so
# nothing from the PR is interpolated into a shell command here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff is base...head, which needs the merge base: full history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The version rises with what the host runs
        run: python3 scripts/check_version.py
