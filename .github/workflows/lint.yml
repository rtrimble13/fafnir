name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Pinned deliberately. Formatters change their output between releases, so an
      # unpinned install makes this job fail on code nobody touched, the first time
      # upstream ships a new style -- which is exactly what happened when black
      # 26.5.x started joining lines that 26.1 had split. Bump these on purpose, in
      # a commit that also reformats, rather than being surprised by it mid-review.
      - name: Install lint tools
        run: pip install black==26.5.1 isort==8.0.1 flake8==7.3.0
      - name: black
        run: black --check --line-length 88 src test
      - name: isort
        run: isort --check-only --profile black --line-length 88 src test
      - name: flake8
        run: flake8 --max-line-length 100 --extend-ignore E203,W503 src test
