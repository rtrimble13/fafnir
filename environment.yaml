name: fafnir
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pip
  - postgresql>=16        # client libs; the server may be a system package
  - pandas
  - scipy
  - pip:
      - click>=8.0.0
      - requests>=2.28.0
      - "psycopg[binary]>=3.1.0"
      - pytest>=7.0.0
      - black>=22.0.0
      - isort>=5.0.0
      - flake8>=4.0.0
